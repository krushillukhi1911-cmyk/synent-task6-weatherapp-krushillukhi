{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="text-center fade-in">
        <div class="mb-4">
            <img src="https://openweathermap.org/img/wn/09d@4x.png" alt="Cloud with rain" style="width: 150px; opacity: 0.8; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));">
        </div>
        
        <h1 class="display-2 fw-bold text-primary-custom mb-2">404</h1>
        <h3 class="fw-bold mb-3">City Not Found</h3>
        <p class="text-muted mb-4 pb-2">Oops! The city you searched for does not exist or we couldn't find data for it.</p>
        
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Go Home</a>
            <!-- Simple button that focuses the navbar search or links to home -->
            <a href="{{ url_for('index') }}" class="btn btn-outline-primary px-4">Search Again</a>
        </div>
    </div>
</div>
{% endblock %}
