{% extends "base.html" %}
{% block title %}Error - WeatherNow{% endblock %}
{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="text-center fade-in">
        <div class="mb-4">
            <img src="https://openweathermap.org/img/wn/11d@4x.png" alt="Thunderstorm" style="width: 150px; opacity: 0.8; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));">
        </div>
        
        <h1 class="display-3 fw-bold text-danger mb-2">Oops!</h1>
        <h3 class="fw-bold mb-3">Something Went Wrong</h3>
        <p class="text-muted mb-4 pb-2">{{ error | default("An unexpected error occurred. Please try again.") }}</p>
        
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
